# ==========================
# DATABASE CONFIGURATION
# ==========================

# Local Development (defaults) + Production (Render/Railway Environment Variables)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:hotel_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# DB credentials
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA CONFIGURATION
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================
# SERVER CONFIGURATION
# ==========================

# Render automatically provides PORT
server.port=${PORT:8081}

spring.devtools.restart.enabled=true

# ==========================
# SWAGGER CONFIGURATION
# ==========================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# ==========================
# CORS
# ==========================

# Local Development
# spring.web.cors.allowed-origins=http://localhost:3000

# Production + Local
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ==========================
# JWT
# ==========================

jwt.secret=${JWT_SECRET:hotel_system_secret_key_very_long_and_secure_2026_default}

# ==========================
# RAZORPAY
# ==========================

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Snenj7RCT2M4vb}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:PNOziZenXTjGYUm7FG18AdKB}